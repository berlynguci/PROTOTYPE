name: Sync backend to Hugging Face Space

on:
  push:
    branches:
      - separate-files

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: Sync backend folder to Hugging Face Space
        uses: huggingface/hub-sync@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_id: berlynguci/thesis-backend
          repo_type: space
          source_dir: backend